<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split the Bill</title>
</head>
<body>
    <h3>Seamlessly split the bill with friends.</h3>

 <div id="currencySettings">

<label for="currency">Choose your currency:</label>

<select id="currency">
<option value="NGN">Nigerian Naira (₦)</option>
<option value="EUR">Euro (€)</option>
<option value="GHS">Ghananian Cedis (₵)</option>
<option value="USD">US Dollar ($)</option>
</select>

 </div>
 
 <h3>Friends and Expenses</h3>
 <section id="friends">
     <div class="person">
    <input type="text" class="personName"
    placeholder="Enter your name"> 

    <input type="number" class="expense"
    placeholder="Enter personal expense" min="0" step="0.01"> 

    <input type="number" class="amount"
    placeholder="Enter amount paid" min="0" step="0.01"> 

    <button type="button" class="removeBtn"
     onclick="removeFriend(this)">Remove</button>
  </div>
 </section>

  <button type="button" id="addBtn" onclick="addFriend()">
      + Add a Friend
        </button>

<h3>Choose Splitting Method</h3>

<label>How would you like to split?</label>
     <select id="splitMethod">
     <option value="equal">Split Equally</option>
     <option value="individual">Individual Expenses</option> 
        </select> 

 <button type="button" id="calculateBtn" onclick="calculateBill()">
     Calculate Bill
        </button>

<div id="result">

 <h2>Payment Summary</h2>

<div id="summary"></div>

     </div>

</div>
<script src="script.js">
</script>
</body>
</html>
