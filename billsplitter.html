<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split the Bill</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
 <h3 style="font-style: italic; font-family: 'Frauces'; text-align: center;">Split the bill with ease!</h3>

    <div id="currencySettings">

        <label for="currency">Choose your currency:</label>

        <select id="currency">
            <option value="NGN">Nigerian Naira (₦)</option>
            <option value="EUR">Euro (€)</option>
            <option value="GHS">Ghananian Cedis (₵)</option>
            <option value="USD">US Dollar ($)</option>
        </select>

    </div>

    <div id="friendExp">
        <h3>Friends and Expenses</h3>
    <section id="friends">
        <div class="person">
            <input type="text" class="personName" placeholder="Enter your name">

            <input type="number" class="expense" placeholder="Enter personal expense" min="0" step="0.01">

            <input type="number" class="amount" placeholder="Enter amount paid" min="0" step="0.01">

            <button type="button" class="removeBtn" onclick="removeFriend(this)">Remove</button>
        </div>
    </section>

    </div>
    <button type="button" id="addBtn" onclick="addFriend()">
        + Add a Friend
    </button>

    <div class="toSplit">
        <h3 id="choose">Choose Splitting Method</h3>
   <label id="splitOption" >How would you like to split?</label>
    <select id="splitMethod">
        <option value="equal">Split Equally</option>
        <option value="individual">Individual Expenses</option>
    </select>
    </div>

    <button type="button" id="calculateBtn" onclick="calculateBill()">
        Calculate Bill
    </button>

    <div id="result">

        <h2 id="ps">Payment Summary</h2>

        <div id="summary"></div>

    </div>

    </div>
    </div>
    <script src="script.js">
    </script>
</body>

</html>
